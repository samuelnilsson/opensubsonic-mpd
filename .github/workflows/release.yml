name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install semantic-release
        run: npm install --save-dev semantic-release @semantic-release/git @semantic-release/changelog @semantic-release/exec

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release

      - name: Get release tag
        id: tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.tag.outputs.tag != 'none'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build binary with Nix
        if: steps.tag.outputs.tag != 'none'
        run: nix build .#default

      - name: Upload binary to release
        if: steps.tag.outputs.tag != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: result/bin/opensubsonic-mpd
          draft: false
          token: ${{ steps.app-token.outputs.token }}

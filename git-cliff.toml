[changelog]
body = """
{% if version %}
## [{{ version }}] - {{ timestamp(date="YYYY-MM-DD") }}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message }}{% endfor %}
{% endfor %}
---
"""

filter_commits = """
{% if message %}
    {% for pattern, label in conventional_commits | map() %}
        {% if message | regex_findall(pattern) %}
            {{ label }}
            {% break %}
        {% endif %}
    {% endfor %}
{% endif %}
"""

[conventional_commits]
patterns = [
    { pattern = "^feat(\\(.+\\))?!?:", message = "Features", group = "Features" },
    { pattern = "^fix(\\(.+\\))?!?:", message = "Bug Fixes", group = "Bug Fixes" },
    { pattern = "^perf(\\(.+\\))?!?:", message = "Performance Improvements", group = "Performance" },
    { pattern = "^revert(\\(.+\\))?!?:", message = "Reverts", group = "Reverts" },
    { pattern = "^docs(\\(.+\\))?!?:", message = "Documentation", group = "Documentation" },
    { pattern = "^style(\\(.+\\))?!?:", message = "Styles", group = "Styles" },
    { pattern = "^refactor(\\(.+\\))?!?:", message = "Code Refactoring", group = "Refactoring" },
    { pattern = "^test(\\(.+\\))?!?:", message = "Tests", group = "Tests" },
    { pattern = "^build(\\(.+\\))?!?:", message = "Build System", group = "Build" },
    { pattern = "^ci(\\(.+\\))?!?:", message = "CI", group = "CI" },
    { pattern = "^chore(\\(.+\\))?!?:", message = "Chores", group = "Chores" },
]
